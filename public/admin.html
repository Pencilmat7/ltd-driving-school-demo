<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LTD Admin — Booking Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#132238}.wrap{max-width:1100px;margin:auto;padding:32px 20px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:25px;font-weight:900}.brand span{color:#f5b400}.card{background:#fff;border:1px solid #e5eaf1;border-radius:20px;padding:22px;box-shadow:0 12px 35px rgba(20,35,55,.07);margin-bottom:18px}input,button{font:inherit}input{padding:12px;border:1px solid #ccd5e1;border-radius:10px;width:100%}button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;background:#102a43;color:white;transition:.2s}button:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(16,42,67,.18)}button.secondary{background:#edf2f7;color:#102a43}.actions a.secondary{border-radius:10px;padding:12px 16px;font-weight:800;color:#102a43}.actions a.secondary:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(16,42,67,.12)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid #edf0f4}.pill{padding:6px 10px;border-radius:999px;background:#eaf7ee;color:#18733b;font-size:12px;font-weight:800}.danger{color:#a12626;background:#fff0f0}.hidden{display:none}.login{max-width:420px;margin:10vh auto}.muted{color:#65758b;font-size:14px}.actions{display:flex;gap:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px;flex-direction:column}}
</style></head><body><div class="wrap"><div id="login" class="card login"><div class="brand">LTD <span>ADMIN</span></div><p class="muted">Private scheduling dashboard demo.</p><input id="user" placeholder="Username" autocomplete="username"><br><br><input id="pass" placeholder="Password" type="password" autocomplete="current-password"><br><br><button onclick="login()">Sign in</button><p id="err" class="muted"></p></div>
<div id="app" class="hidden"><div class="top"><div><div class="brand">LTD <span>ADMIN</span></div><div class="muted">Appointments & availability · DEMO MODE</div></div><div class="actions"><a href="/" class="secondary" style="text-decoration:none;display:inline-flex;align-items:center">← Website</a><button class="secondary" onclick="logout()">Log out</button></div></div>
<div class="card"><h2>Block a time</h2><p class="muted">Use this when a time should not be bookable.</p><div class="grid"><input id="date" type="date"><select id="time" style="padding:12px;border:1px solid #ccd5e1;border-radius:10px"><option value="10:00">10:00 AM</option><option value="12:00">12:00 PM</option><option value="14:00">2:00 PM</option><option value="16:00">4:00 PM</option></select></div><br><button onclick="block()">Block time</button></div>
<div class="card"><h2>Appointments</h2><div id="list"></div></div><div class="card"><h2>Blocked times</h2><div id="blocked"></div></div></div></div>
<script>
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});const d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}
async function login(){try{await api('/api/login',{method:'POST',body:JSON.stringify({username:user.value,password:pass.value})});showApp()}catch(e){err.textContent=e.message}}
async function showApp(){loginEl.classList.add('hidden');app.classList.remove('hidden');await load()} async function load(){const d=await api('/api/admin/appointments');list.innerHTML=d.appointments.length?d.appointments.map(a=>`<div class="row"><div><b>${a.date} · ${fmt(a.time)}</b><br>${esc(a.name)} · ${esc(a.phone)}<br><span class="muted">${esc(a.service)}</span></div><div class="actions"><span class="pill">BOOKED</span><button class="danger" onclick="cancelA('${a.id}')">Cancel</button></div></div>`).join(''):'<p class="muted">No appointments yet.</p>';blocked.innerHTML=d.blocked.length?d.blocked.map(a=>`<div class="row"><b>${a.date} · ${fmt(a.time)}</b><button class="secondary" onclick="unblock('${a.id}')">Unblock</button></div>`).join(''):'<p class="muted">No blocked times.</p>'}
async function block(){try{await api('/api/admin/block',{method:'POST',body:JSON.stringify({date:date.value,time:time.value})});await load()}catch(e){alert(e.message)}} async function cancelA(id){if(confirm('Cancel this appointment?')){await api('/api/admin/appointments/'+id,{method:'DELETE'});await load()}} async function unblock(id){await api('/api/admin/block/'+id,{method:'DELETE'});await load()} async function logout(){await api('/api/logout',{method:'POST'});location.reload()} function fmt(t){let [h,m]=t.split(':');h=+h;return `${h%12||12}:${m} ${h>=12?'PM':'AM'}`}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}const loginEl=document.getElementById('login');const app=document.getElementById('app');api('/api/me').then(x=>x.authenticated&&showApp());
</script></body></html>
